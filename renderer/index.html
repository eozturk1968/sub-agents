<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Sub-Agents</title>
<link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="tabs" role="tablist" aria-label="Sidebar">
      <button type="button" role="tab" id="tab-models" aria-selected="true" aria-controls="panel-models">Models</button>
      <button type="button" role="tab" id="tab-files" aria-selected="false" aria-controls="panel-files">Files</button>
    </div>
    <div id="panel-models" class="tab-panel" role="tabpanel" aria-labelledby="tab-models">
    <div class="col gap4">
      <h1 class="title">All AI models</h1>
      <p class="muted small">Drag a model onto the canvas, or click to add it</p>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span class="sr">Search models</span>
      <input id="search" type="search" placeholder="Filter by name">
    </label>
    <ul id="model-list" class="model-list"></ul>
    <div class="grow"></div>
    <div id="connected" class="col gap8"></div>
    </div>
    <div id="panel-files" class="tab-panel" role="tabpanel" aria-labelledby="tab-files" hidden></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div id="status" class="status"></div>
      <button id="save-team" class="btn" type="button">Save team</button>
      <button id="new-team" class="btn" type="button">New team</button>
      <button id="open-team" class="btn" type="button">Open team</button>
      <button id="folder" class="btn" type="button"></button>
      <label class="check"><input id="allow-run" type="checkbox"> Let leader run sub-agents</label>
      <button id="term-toggle" class="btn" type="button" aria-pressed="false" title="Terminal"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></svg> Terminal</button>
      <button id="clear" class="btn" type="button">Clear canvas</button>
      <button id="settings" class="icon-btn boxed gear" type="button" aria-label="Settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="team-tabs" class="team-tabs" role="tablist" aria-label="Open teams"></div>
    <div id="canvas" class="canvas with-tabs">
      <div id="world" class="world">
        <svg id="wires" class="wires" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div id="view-controls" class="view-controls" role="group" aria-label="Zoom">
        <button type="button" class="vbtn" data-v="out" aria-label="Zoom out" title="Zoom out (Cmd −)">−</button>
        <button type="button" class="vbtn pct" data-v="reset" id="zoom-pct" title="Reset to 100% (Cmd 0)">100%</button>
        <button type="button" class="vbtn" data-v="in" aria-label="Zoom in" title="Zoom in (Cmd +)">+</button>
        <button type="button" class="vbtn fit" data-v="fit" title="Show all agents (Space)">Fit</button>
        <label class="scroll-zooms" title="On: scrolling zooms, like LTspice. Off: two-finger scroll moves, pinch zooms."><input type="checkbox" id="scroll-zooms"> Scroll zooms</label>
      </div>
      <aside id="chatpanel" class="cp" aria-label="Chat" hidden></aside>
      <button id="cp-pill" class="cp-pill" type="button" hidden></button>
      <div id="empty" class="empty">Drag a model here. The first one becomes the leader.</div>
    </div>
    <section id="term-panel" class="term-panel" aria-label="Terminal" hidden>
      <div id="term-resize" class="term-resize" title="Drag to resize" aria-hidden="true"></div>
      <div class="term-head">
        <span class="term-title">Terminal</span>
        <div id="term-tabs" class="term-tabs" role="tablist" aria-label="Terminal tabs"></div>
        <span class="grow"></span>
        <button type="button" id="term-min" class="term-ctl" aria-label="Hide terminal" title="Hide (keeps tabs)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button type="button" id="term-close" class="term-ctl" aria-label="Close all terminals" title="Close all terminals"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="term-views" class="term-views"></div>
    </section>
    <p class="copyright">Copyright (c) 2026 Erdinc Ozturk. All rights reserved.</p>
  </main>
</div>

<div id="modal"></div>

<script src="view.js"></script>
<script src="settings.js"></script>
<script src="chatstore.js"></script>
<script src="files.js"></script>
<script src="teams.js"></script>
<script src="tabs.js"></script>
<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="terminal.js"></script>
<script src="../node_modules/marked/lib/marked.umd.js"></script>
<script src="../node_modules/dompurify/dist/purify.min.js"></script>
<script src="chatpanel.js"></script>
<script src="renderer.js"></script>
</body>
</html>
