name: Release

# Push a tag like v0.1.0 and GitHub builds the Mac .dmg and the Windows .exe,
# then publishes them on the Releases page.
# Or: Actions tab > Release > Run workflow, and type the version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: |
              dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: |
              dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # The terminal uses node-pty's prebuilt binaries. npm only installs the one for this
      # runner's CPU, so on the Mac runner also add the other Mac CPU (both dmgs need theirs).
      - name: Add both Mac terminal binaries
        if: runner.os == 'macOS'
        run: npm install --no-save --force @lydell/node-pty-darwin-x64@1.2.0-beta.18 @lydell/node-pty-darwin-arm64@1.2.0-beta.18
      # Unsigned build: no Apple or Windows signing certificate yet.
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Fail the release if an installer is missing its terminal binary.
      - name: Check terminal binaries are packaged
        shell: bash
        run: |
          set -e
          if [ "$RUNNER_OS" = "macOS" ]; then
            ls dist/mac-arm64/*.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell/node-pty-darwin-arm64/prebuilds/darwin-arm64/pty.node
            ls dist/mac/*.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell/node-pty-darwin-x64/prebuilds/darwin-x64/pty.node
            test -x dist/mac/*.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell/node-pty-darwin-x64/prebuilds/darwin-x64/spawn-helper
            test -x dist/mac-arm64/*.app/Contents/Resources/app.asar.unpacked/node_modules/@lydell/node-pty-darwin-arm64/prebuilds/darwin-arm64/spawn-helper
          else
            ls dist/win-unpacked/resources/app.asar.unpacked/node_modules/@lydell/node-pty-win32-x64/prebuilds/win32-x64/conpty.node
            ls dist/win-unpacked/resources/app.asar.unpacked/node_modules/@lydell/node-pty-win32-x64/prebuilds/win32-x64/conpty/OpenConsole.exe
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Sub-Agents ${{ env.TAG }}
          files: ${{ matrix.files }}
          body: |
            **Mac (Apple Silicon M1–M4):** download `the `.dmg` ending in `arm64``
            **Mac (Intel):** download the `.dmg` without `arm64`
            **Windows:** download `Sub-Agents Setup ….exe`

            These builds are unsigned. On first launch:
            - Mac: right-click the app, choose Open, then Open again (or System Settings > Privacy & Security > Open Anyway).
            - Windows: if SmartScreen appears, click More info, then Run anyway.

            You also need at least one AI tool installed and signed in (Claude Code, Codex or Antigravity). See the README.
